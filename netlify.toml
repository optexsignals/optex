# optexmodel.com           = OPTEX Market Timing Model (root; the professional version since 2026-11-07)
# optexmodel.com/r         = OPTEX Market Timing Model, retail version
# optexmodel.com/allweather   = OPTEX all-weather stock portfolio, professional version (since 2026-11-08)
# optexmodel.com/allweather/r = OPTEX all-weather stock portfolio, retail version
[build]
  publish = "."

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/allweather/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/allweather/og.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/allweather/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

# optexmodel.com/live (2026-11-08): the page's /api/live/* requests are forwarded to the model service on the VM
# (Tailscale Funnel). Only prices go out and only a position comes back; the model stays on the VM.
[[redirects]]
  from = "/api/live/*"
  to = "https://optex-vm.tail69c3ee.ts.net/api/live/:splat"
  status = 200
  force = true

# Old all-weather addresses from before the move. The Market Timing archive uses ?day=, so an old ?d= link is all-weather.
[[redirects]]
  from = "/archive.html"
  to = "/allweather/archive.html?d=:d"
  query = {d = ":d"}
  status = 301
  force = true

[[redirects]]
  from = "/portfolio.html"
  to = "/allweather/portfolio.html"
  status = 301

[[redirects]]
  from = "/feed.xml"
  to = "/allweather/feed.xml"
  status = 301

[[redirects]]
  from = "/og.png"
  to = "/allweather/og.png"
  status = 301

[[redirects]]
  from = "/share.png"
  to = "/allweather/share.png"
  status = 301

[[redirects]]
  from = "/posts/*"
  to = "/allweather/posts/:splat"
  status = 301

[[redirects]]
  from = "/pro/*"
  to = "/allweather/:splat"
  status = 301

[[redirects]]
  from = "/allweather/pro/*"
  to = "/allweather/:splat"
  status = 301
